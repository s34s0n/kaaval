# Kaaval frontend: static SPA + same-origin reverse proxy to the backend.
# The backend service is reachable as `backend:8000` on the compose network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST API — pass /api/* through unchanged to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (analyst chat) must stream, not buffer.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSockets — /ws and /ws/telemetry (prefix match).
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA routes (/, /range, …) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
